# Checks that the package installs and passes its tests on macOS, Windows and Linux.
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-latest, r: release }
          - { os: windows-latest, r: release }
          - { os: ubuntu-latest, r: release }
          - { os: ubuntu-latest, r: oldrel-1 }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  install-from-github:
    # The way other machines will install it: no Rtools or Xcode needed.
    runs-on: ${{ matrix.os }}
    name: install_github on ${{ matrix.os }}
    env:
      # remotes asks GitHub's API for the package; without a token the shared
      # runners hit the anonymous rate limit.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install and save a viewer
        shell: Rscript {0}
        run: |
          install.packages("remotes")
          remotes::install_github("${{ github.repository }}@${{ github.sha }}", upgrade = "never")
          library(plank)
          out <- file.path(tempdir(), "iris viewer.html")
          save_plank(iris, out, title = "Iris")
          stopifnot(file.exists(out), file.size(out) > 50000)
          cat("OK:", out, file.size(out), "bytes\n")
