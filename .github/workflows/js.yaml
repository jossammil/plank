# Unit tests for the browser code, a check that the committed bundle is up to
# date, and end-to-end tests of a 100,000-row page in Chromium and WebKit.
name: js

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srcjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: srcjs/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Committed bundle matches the sources
        run: |
          npm run build
          git diff --exit-code -- ../inst/htmlwidgets/lib/plank/plank-core.js

  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::readxl
      - name: Build the demo page
        run: Rscript examples/make-demo.R
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: srcjs/package-lock.json
      - working-directory: srcjs
        run: |
          npm ci
          npx playwright install chromium webkit
      - name: Chromium
        working-directory: srcjs
        run: npm run e2e
      - name: WebKit (Safari engine)
        working-directory: srcjs
        run: BROWSER=webkit npm run e2e
