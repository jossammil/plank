# Publishes examples/sample.pqv.html to GitHub Pages, so the sample opens in
# a browser from a link: https://jossammil.github.io/pqview/
name: pages

on:
  push:
    branches: [main]
    paths:
      - examples/sample.pqv.html
      - .github/workflows/pages.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir site
          cp examples/sample.pqv.html site/index.html
          cp examples/sample.pqv.html site/sample.pqv.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
