# Builds the website and publishes it with GitHub Pages:
# https://jossammil.github.io/plank/  (landing page: about, features, size and
# speed, keyboard shortcuts), /demo.html (the 100,000-row Plank demo) and
# /viewer.html (a blank viewer). The landing page is generated by
# srcjs/tools/build-site.mjs from site/index.template.html, site/bench.json
# and srcjs/src/keys.js.
name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - srcjs/src/**
      - srcjs/tools/build-site.mjs
      - inst/htmlwidgets/**
      - R/**
      - examples/**
      - DESCRIPTION
      - .github/workflows/pages.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
      - name: Build the demo and the blank viewer
        run: |
          Rscript examples/make-demo.R
          Rscript examples/make-viewer.R
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site
        run: node srcjs/tools/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@v4
